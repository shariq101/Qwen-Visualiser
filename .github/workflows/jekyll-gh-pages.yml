# Build and deploy the static Vite React app to GitHub Pages.
#
# This workflow matches the project README: run `npm ci && npm run build`,
# upload `dist/`, and publish it to GitHub Pages. The app is fully static and
# uses `base: "./"` in vite.config.ts, so the same build works at a project
# page (user.github.io/repo/) and at a custom domain.
#
# Prerequisites (one-time, in the GitHub UI):
#   Settings -> Pages -> Build and deployment -> Source = GitHub Actions

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
